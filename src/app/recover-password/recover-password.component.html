<div class="card" style="max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
  <h1 style="text-align: center;">Recuperar Contraseña</h1>
  
  <form (ngSubmit)="sendRecoveryEmail()">
    <!-- Campo de Correo Electrónico -->
    <div class="form-group">
      <label for="email">Correo electrónico:</label>
      <input type="email" id="email" name="email" [(ngModel)]="email" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px; width: 100%;" required />
    </div>
    
    <!-- Botón para recuperar la contraseña -->
    <button type="submit" style="background-color: #5cb85c; border: none; color: white; padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%;">
      Recuperar contraseña
    </button>
  </form>
</div>
