<div class="card" style="max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);">
  <h1 style="text-align: center;">Cambiar Contraseña</h1>
  
  <!-- Campo de Correo Electrónico -->
  <div class="form-group">
    <label for="email">Correo Electrónico</label>
    <input type="email" id="email" name="email" [(ngModel)]="email" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px; width: 100%;" required>
  </div>
  
  <!-- Nueva Contraseña -->
  <div class="form-group">
    <label for="password">Escriba su nueva contraseña</label>
    <input type="password" id="password" name="password" [(ngModel)]="nuevaContrasena" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px; width: 100%;" required>
  </div>
  
  <!-- Confirmar Nueva Contraseña -->
  <div class="form-group">
    <label for="confirm-password">Confirme su nueva contraseña</label>
    <input type="password" id="confirm-password" name="confirm-password" [(ngModel)]="confirmContrasena" style="padding: 10px; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 10px; width: 100%;" required>
  </div>
  
  <!-- Botón para cambiar la contraseña -->
  <button type="button" (click)="resetPassword()" style="background-color: #5cb85c; border: none; color: white; padding: 15px 32px; text-align: center; text-decoration: none; display: inline-block; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%;">
    CAMBIAR LA CONTRASEÑA
  </button>
</div>
